name: CI/CD Pipeline

on:
    push:
        branches: [master, main, develop]
    pull_request:
        branches: [master, main, develop]

# Sửa lỗi nghẽn hàng chờ: Hủy các job cũ khi có push mới trên cùng một nhánh
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    DOCKER_IMAGE_NAME: duckhwee/qwaste_v2
    DOCKER_REGISTRY: docker.io

jobs:
    # Test and Build Job
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.9.0'
                  cache: 'npm' # Cache npm dependencies

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.next/cache
                  # Key này sẽ dùng lại cache cũ trừ khi file package-lock.json thay đổi
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint:check

            - name: Build application
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-files
                  path: .next/

